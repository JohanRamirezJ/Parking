services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartpark
      POSTGRES_USER: smartpark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpark}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://smartpark:${POSTGRES_PASSWORD:-smartpark}@db:5432/smartpark
      SECRET_KEY: ${SECRET_KEY:-dev-secret-cambiar}
      FLASK_ENV: ${FLASK_ENV:-development}
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
