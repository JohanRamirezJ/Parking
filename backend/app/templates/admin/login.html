{% extends "admin/base.html" %}
{% block titulo %}Ingresar · SmartPark Admin{% endblock %}
{% block contenido %}
<div class="login card">
  <h1>Smart<span style="color:var(--primary)">Park</span> Admin</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="campo"><label for="email">Correo</label><input id="email" name="email" type="email" required autofocus></div>
    <div class="campo"><label for="password">Contraseña</label><input id="password" name="password" type="password" required></div>
    <button class="btn primario" style="width:100%">Ingresar</button>
  </form>
</div>
{% endblock %}
