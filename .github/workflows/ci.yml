name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartpark
          POSTGRES_PASSWORD: smartpark
          POSTGRES_DB: smartpark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartpark" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas con SQLite (en memoria)
        run: python -m pytest -q
      - name: Pruebas con PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://smartpark:smartpark@localhost:5432/smartpark_test
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen y probar el healthcheck en modo producción
        run: |
          docker build -t smartpark-backend backend
          docker run -d --name api -p 5000:5000 \
            -e FLASK_ENV=production -e SECRET_KEY=ci-secret-$RANDOM-largo -e JWT_SECRET=ci-jwt-$RANDOM-largo \
            smartpark-backend
          for i in $(seq 1 30); do curl -fs localhost:5000/api/salud && exit 0; sleep 2; done
          docker logs api; exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
