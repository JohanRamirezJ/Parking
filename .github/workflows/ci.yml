name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartpark/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smartpark/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen y probar el healthcheck
        run: |
          docker build -t smartpark-api smartpark/backend
          docker run -d --name api -p 5000:5000 -e FLASK_ENV=production -e SECRET_KEY=ci-secret smartpark-api
          for i in $(seq 1 20); do curl -fs localhost:5000/api/salud && exit 0; sleep 2; done
          docker logs api; exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartpark/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
